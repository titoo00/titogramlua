name: Lua CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Lua
      uses: hishamhm/gh-actions-lua@master
      with:
        luaVersion: "5.1"

    - name: Setup LuaRocks
      uses: hishamhm/gh-actions-luarocks@master

    - name: Install Linting Tools
      run: luarocks install luacheck

    - name: Run Lint Check
      run: luacheck src/ --no-unused-args --no-max-line-length --globals _G _TEST || true
