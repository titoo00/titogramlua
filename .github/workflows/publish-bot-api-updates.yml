name: Publish library updates to LuaRocks

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Publish package source changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- src/methods/updates.lua src/wallet_pay.lua; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Lua and LuaRocks
        if: steps.changes.outputs.changed == 'true'
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Install LuaRocks
        if: steps.changes.outputs.changed == 'true'
        uses: leafo/gh-actions-luarocks@v5

      - name: Create and upload a unique rockspec
        if: steps.changes.outputs.changed == 'true'
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          if [ -z "$LUAROCKS_API_KEY" ]; then
            echo "::error::Set the LUAROCKS_API_KEY repository secret to enable publishing."
            exit 1
          fi
          base="titogramlua.rockspec"
          base_version="$(sed -nE 's/^version = "([0-9]+\\.[0-9]+\\.[0-9]+)-[0-9]+"$/\\1/p' "$base")"
          if [ -z "$base_version" ]; then
            echo "::error::Could not read the base version from $base."
            exit 1
          fi
          version="$base_version-$RUN_NUMBER"
          source_tag="luarocks-v$version"
          output="titogramlua-$version.rockspec"
          sed -E \
            -e "s/^version = \"[^\"]+\"/version = \"$version\"/" \
            -e "s|tag = \"[^\"]+\"|tag = \"$source_tag\"|" \
            "$base" > "$output"

          if git ls-remote --exit-code --tags origin "refs/tags/$source_tag" >/dev/null; then
            git fetch origin "refs/tags/$source_tag:refs/tags/$source_tag"
            existing_sha="$(git rev-parse "$source_tag^{commit}")"
            if [ "$existing_sha" != "$SOURCE_SHA" ]; then
              echo "::error::Tag $source_tag already points to a different source commit."
              exit 1
            fi
          else
            git tag "$source_tag" "$SOURCE_SHA"
            git push origin "refs/tags/$source_tag"
          fi

          luarocks upload "$output" --api-key="$LUAROCKS_API_KEY"
