name: Publish Bot API updates to LuaRocks

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Publish only generated Bot API changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- src/methods/updates.lua .github/workflows/publish-bot-api-updates.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Lua and LuaRocks
        if: steps.changes.outputs.changed == 'true'
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Install LuaRocks
        if: steps.changes.outputs.changed == 'true'
        uses: leafo/gh-actions-luarocks@v5

      - name: Create and upload a unique rockspec
        if: steps.changes.outputs.changed == 'true'
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        shell: bash
        run: |
          if [ -z "$LUAROCKS_API_KEY" ]; then
            echo "::error::Set the LUAROCKS_API_KEY repository secret to enable publishing."
            exit 1
          fi
          base="rockspecs/titogramlua-1.1.0-1.rockspec"
          version="1.1.1-$RUN_NUMBER"
          output="rockspecs/titogramlua-$version.rockspec"
          sed -e "s/rockspec_format = \"1.1.0\"/rockspec_format = \"1.1\"/" -e "s/version = \"1.1.0-1\"/version = \"$version\"/" "$base" > "$output"
          luarocks upload "$output" --api-key="$LUAROCKS_API_KEY"
