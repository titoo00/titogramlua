name: Publish library updates to LuaRocks

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Publish package source changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- src/methods/updates.lua src/wallet_pay.lua rockspecs/titogramlua-3.7.2-0.rockspec .github/workflows/publish-bot-api-updates.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Lua and LuaRocks
        if: steps.changes.outputs.changed == 'true'
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Install LuaRocks
        if: steps.changes.outputs.changed == 'true'
        uses: leafo/gh-actions-luarocks@v5

      - name: Create and upload a unique rockspec
        if: steps.changes.outputs.changed == 'true'
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          if [ -z "$LUAROCKS_API_KEY" ]; then
            echo "::error::Set the LUAROCKS_API_KEY repository secret to enable publishing."
            exit 1
          fi
          base="rockspecs/titogramlua-3.7.2-0.rockspec"
          version="3.7.2-$RUN_NUMBER"
          output="rockspecs/titogramlua-$version.rockspec"
          sed -e "s/version = \"3.7.2-0\"/version = \"$version\"/" -e "s/tag = \"v3.7.2\"/tag = \"$SOURCE_SHA\"/" "$base" > "$output"
          luarocks upload "$output" --api-key="$LUAROCKS_API_KEY"
